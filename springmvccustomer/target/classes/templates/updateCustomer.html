<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Update Customer</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .form-container {
        width: 100%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        animation: slideIn 1s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        text-align: center;
        color: #fff;
        margin-bottom: 25px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .input-group input,
    .input-group textarea {
        width: 100%;
        padding: 12px 15px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        outline: none;
        color: #fff;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .input-group textarea {
        resize: none;
        height: 80px;
    }

    .input-group label {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        transition: 0.3s ease;
        font-size: 13px;
        background: transparent;
    }

    .input-group input:focus,
    .input-group textarea:focus {
        border-color: #00e6e6;
        box-shadow: 0 0 10px rgba(0, 230, 230, 0.6);
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label,
    .input-group textarea:focus + label,
    .input-group textarea:not(:placeholder-shown) + label {
        top: -8px;
        left: 12px;
        font-size: 11px;
        color: #00e6e6;
        background: #203a43;
        padding: 0 6px;
        border-radius: 6px;
    }

    .submit-btn {
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #00e6e6, #00b3b3);
        color: #003333;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(0, 230, 230, 0.5);
    }

    .back-link {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: #fff;
        font-size: 13px;
        text-decoration: none;
        opacity: 0.85;
    }

    .back-link:hover {
        opacity: 1;
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="form-container">
    <h2>✏️ Update Customer</h2>

    <form th:action="@{/updateCustomer}" th:object="${customer}" method="post">

        <!-- IMPORTANT: ID must be hidden -->
        <input type="hidden" th:field="*{id}"/>

        <div class="input-group">
            <input type="text" th:field="*{name}" required placeholder=" ">
            <label>Customer Name</label>
        </div>

        <div class="input-group">
            <input type="email" th:field="*{email}" required placeholder=" ">
            <label>Email Address</label>
        </div>

        <div class="input-group">
            <input type="number" th:field="*{phone}" required placeholder=" ">
            <label>Phone Number</label>
        </div>

        <div class="input-group">
            <textarea th:field="*{address}" required placeholder=" "></textarea>
            <label>Address</label>
        </div>

        <button type="submit" class="submit-btn">Update Customer</button>
    </form>

    <a href="/customers" class="back-link">← Back to Customer List</a>
</div>

</body>
</html>
