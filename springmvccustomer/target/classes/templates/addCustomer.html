<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Add Customer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}

.form-box {
    width: 420px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

h2 {
    text-align: center;
    color: #fff;
    margin-bottom: 25px;
}

.input-group {
    position: relative;
    margin-bottom: 18px;
}

.input-group input,
.input-group textarea {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 10px;
    color: #fff;
    outline: none;
}

.input-group label {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.7);
    pointer-events: none;
    transition: 0.3s;
}

.input-group input:focus + label,
.input-group textarea:focus + label,
.input-group input:not(:placeholder-shown) + label,
.input-group textarea:not(:placeholder-shown) + label {
    top: -8px;
    font-size: 11px;
    background: #203a43;
    padding: 0 6px;
    color: #00e6e6;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #00e6e6, #00b3b3);
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(0,230,230,0.6);
}

a {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #fff;
    text-decoration: none;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="form-box">
<h2>➕ Add Customer</h2>

<form th:action="@{/saveCustomer}" th:object="${customer}" method="post">

<div class="input-group">
<input type="text" th:field="*{name}" required placeholder=" ">
<label>Name</label>
</div>

<div class="input-group">
<input type="email" th:field="*{email}" required placeholder=" ">
<label>Email</label>
</div>

<div class="input-group">
<input type="text" th:field="*{phone}" required placeholder=" ">
<label>Phone</label>
</div>

<div class="input-group">
<textarea th:field="*{address}" required placeholder=" "></textarea>
<label>Address</label>
</div>

<button type="submit">Save Customer</button>
</form>

<a href="/customers">← Back</a>
</div>

</body>
</html>
